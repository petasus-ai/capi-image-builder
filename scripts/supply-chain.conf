# Shared configuration for the supply-chain pipelines, sourced by
# scripts/{sbom,vuln,provenance}-pipeline.sh and scripts/backfill-sbom.sh.
#
# This is the only file in those pipelines that names this repository, its
# registry namespace or its mirror — the scripts themselves are byte-identical
# to the ones in petasus-ai/edgestack-image-builder, so fixes can be moved
# between the two with a plain diff. Keep it that way: builder-specific values
# belong here, not in the scripts.
#
# shellcheck shell=bash disable=SC2034

# Registry holding the golden container-disk images.
REGISTRY_HOST="quay.io"
REGISTRY_NAMESPACE="edgestack"

# Where the disk image sits inside the container-disk layer, as a tar glob.
# This builder's Dockerfile ADDs the Packer artifact under its bare vm_name
# (<build_name>-kube-<semver>, no extension), so the glob cannot filter on one.
IMAGE_DISK_GLOB="disk/*"

# Public GitHub repository the portal reads SBOM / vulnerability / signature
# documents from. Shared with edgestack-image-builder: paths are keyed by image
# repo name and manifest digest (<image-repo>/sha256-<hex>.<kind>.json), and
# this builder's repo names (<os>-kube) never collide with that builder's
# (<os>-container-disk).
MIRROR_OWNER="petasus-ai"
MIRROR_NAME="edgestack-image-sbom"
MIRROR_BRANCH="main"

# Identity stamped on the mirror commits.
MIRROR_GIT_NAME="capi-image-builder CI"
MIRROR_GIT_EMAIL="edgestack-ci@users.noreply.github.com"

# Builder identity, used by the provenance pipeline only:
#   BUILDER_REPO      fallback for GITHUB_REPOSITORY, and a redaction marker
#   BUILDER_ORG       org that owns the workflow — the keyless signing
#                     certificate identity must live under it
#   SLSA_BUILD_TYPE   buildType URI of the SLSA v1 statement
BUILDER_REPO="petasus-ai/capi-image-builder"
BUILDER_ORG="petasus-ai"
SLSA_BUILD_TYPE="https://github.com/petasus-ai/capi-image-builder/golden-image/v1"

# Human-readable signer the portal displays in place of the workflow URI, which
# names the private builder repo and must never reach the mirror.
SIGNER_DISPLAY_NAME="Petasus AI Cloud build pipeline (GitHub Actions)"

# In-place upgrade freeze policy. Accelerator images bake apt pins / dnf
# excludes (ansible/roles/freeze) that stop these packages from ever upgrading
# on a running node — the supported fix is a rebuild. The vuln pipeline marks
# matching findings artifact.frozen so the portal reports them as
# rebuild-to-fix instead of patch-in-place. Builders without a freeze policy
# leave both unset (every finding then stays frozen:false).
#
#   FREEZE_MARKER_REGEX  identifies a frozen image by its SBOM: the freeze
#                        role only runs where DOCA is installed, so DOCA's
#                        packages ARE the policy bit. (No nvidia-* marker
#                        here: this builder ships no host GPU driver — it
#                        arrives at runtime via the GPU Operator.)
#   FREEZE_PKG_REGEX     names covered by the freeze — the union of both
#                        family lists in roles/freeze/defaults/main.yml, which
#                        this must follow.
FREEZE_MARKER_REGEX='^(doca-ofed|doca-host|mlnx-ofa)'
FREEZE_PKG_REGEX='^(linux-(image|headers|modules|generic)|kernel($|-)|doca-|mlnx-|ofed-|rdma-core|libibverbs|librdmacm|ibverbs-|infiniband-diags$|perftest$|ucx($|-)|lustre|vastnfs|dkms$|gcc($|-)|make$|libelf-dev$|elfutils-libelf-devel$)'

# Derived — do not edit.
REGISTRY="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}"
MIRROR_SLUG="${MIRROR_OWNER}/${MIRROR_NAME}"
MIRROR_HTTPS="https://github.com/${MIRROR_SLUG}.git"
MIRROR_RAW="https://raw.githubusercontent.com/${MIRROR_SLUG}/${MIRROR_BRANCH}"
