[defaults]
# Per-user path: with pipelining, become-root modules create remote_tmp as root:0700,
# which breaks non-pipelinable (async/file-transfer) tasks running as the login user.
remote_tmp = /tmp/.ansible-$USER
display_skipped_hosts = False
# Per-task wall-clock timings for build-performance profiling (prints slowest tasks at the end).
# https://docs.ansible.com/ansible/latest/collections/ansible/posix/profile_tasks_callback.html
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
# One SSH round trip per task instead of three.
# https://docs.ansible.com/ansible/latest/reference_appendices/config.html#ansible-pipelining
pipelining = True
