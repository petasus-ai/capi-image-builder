---
- include_tasks: deb_main.yml
  when: ansible_os_family == "Debian"

- include_tasks: el_main.yml
  when: ansible_os_family == "RedHat"

- name: download nerdctl binary
  get_url:
    url: https://github.com/containerd/nerdctl/releases/download/v2.3.3/nerdctl-2.3.3-linux-{{ distro_arch }}.tar.gz
    dest: /tmp/nerdctl.tar.gz
    validate_certs: no
    mode: '0500'

- name: creates nerdctl tmp directory
  file:
    path: /tmp/nerdctl
    state: directory

- name: creates nerdctl configuration directory
  file:
    path: /etc/nerdctl
    state: directory

- name: uncompress nerdctl
  unarchive:
    src: /tmp/nerdctl.tar.gz
    dest: /tmp/nerdctl
    remote_src: yes

- name: install nerdctl binary to /usr/local/bin
  copy:
    src: /tmp/nerdctl/nerdctl
    dest: /usr/local/bin/nerdctl
    owner: root
    group: root
    mode: '0500'
    remote_src: yes

- name: install nerdctl binary to /usr/bin
  copy:
    src: /tmp/nerdctl/nerdctl
    dest: /usr/bin/nerdctl
    owner: root
    group: root
    mode: '0500'
    remote_src: yes

- name: copy nerdctl configuration
  copy:
    src: nerdctl.toml
    dest: /etc/nerdctl/nerdctl.toml
    owner: root
    group: root
    mode: '0644'

- name: remove nerdctl directory
  file:
    path: /tmp/nerdctl
    state: absent

- name: remove nerdctl binary
  file:
    path: /tmp/nerdctl.tar.gz
    state: absent

- name: download helm
  get_url:
    url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ distro_arch }}.tar.gz"
    dest: /tmp/helm.tar.gz
    checksum: "sha256:https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ distro_arch }}.tar.gz.sha256sum"
    mode: '0600'

- name: creates helm tmp directory
  file:
    path: /tmp/helm
    state: directory

- name: uncompress helm
  unarchive:
    src: /tmp/helm.tar.gz
    dest: /tmp/helm
    remote_src: yes

- name: install helm binary to /usr/local/bin
  copy:
    src: "/tmp/helm/linux-{{ distro_arch }}/helm"
    dest: /usr/local/bin/helm
    owner: root
    group: root
    mode: '0755'
    remote_src: yes

- name: remove helm directory
  file:
    path: /tmp/helm
    state: absent

- name: remove helm archive
  file:
    path: /tmp/helm.tar.gz
    state: absent
