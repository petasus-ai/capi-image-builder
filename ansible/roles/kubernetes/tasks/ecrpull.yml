# TODO: This task will be deprecated once https://github.com/containerd/cri/issues/1131 is fixed
# Flags rather than a config file, for the reason kubeadmpull.yml gives: a
# config file pins a kubeadm API version that a later release will remove.
- name: Get images list
  shell: >-
    kubeadm config images list
    --kubernetes-version {{ kubernetes_semver }}
    --image-repository {{ kubernetes_container_registry }}
  register: images_list

- name: Log into ECR
  command: >
    aws ecr get-authorization-token
    --registry-ids {{ kubernetes_container_registry.split('.')[0] }}
    --region {{ kubernetes_container_registry.split('.')[3] }}
    --output text
    --query 'authorizationData[].authorizationToken'
  register: credentials

- name: Pull images
  command: "crictl pull --creds {{ credentials.stdout | b64decode }} {{ item }}"
  loop: "{{ images_list.stdout_lines }}"
