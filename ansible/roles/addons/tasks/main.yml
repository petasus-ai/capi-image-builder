---
- name: Create temporary download dir
  file:
    path: /tmp/images
    state: directory

- name: Copy all images to destination directory
  copy:
    src: "{{ item }}"
    dest: /tmp/images
  with_fileglob:
    - "{{ role_path }}/files/images/calico/*"
    - "{{ role_path }}/files/images/antrea/*"
    - "{{ role_path }}/files/images/cilium/*"
    - "{{ role_path }}/files/images/purelb/*"
    - "{{ role_path }}/files/images/openebs/*"
    - "{{ role_path }}/files/images/dashboard/*"
    - "{{ role_path }}/files/images/kubesphere/*"

- name: Register the file list
  command: "ls /tmp/images"
  register: images

- name: Load additional images
  shell: 'CONTAINERD_NAMESPACE="k8s.io" {{ sysusr_prefix }}/bin/ctr --address={{ containerd_cri_socket }} images import --no-unpack /tmp/images/{{ item }}'
  loop: "{{ images.stdout_lines }}"

- name: Remove downloaded files
  file:
    state: absent
    path: "/tmp/images"
