---
- name: RHEL subscription
  redhat_subscription:
    state: present
    username: "{{ lookup('env', 'RHSM_USER') }}"
    password: "{{ lookup('env', 'RHSM_PASS') }}"
    auto_attach: true
  when: ansible_distribution == "RedHat"

- name: import epel gpg key
  rpm_key:
    state: present
    key: "{{ epel_rpm_gpg_key }}"
  when: epel_rpm_gpg_key != ""

- name: add epel repo
  yum:
    name: "{{ redhat_epel_rpm }}"
    state: present
    lock_timeout: 60
  when: redhat_epel_rpm != ""

- name: "Enable RockyLinux Plus repo"
  community.general.ini_file:
    path:       /etc/yum.repos.d/rocky-extras.repo
    section:    plus
    option:     enabled
    value:      1
    create:     no
  when: ansible_distribution == "Rocky" and ansible_architecture == "aarch64"

- name: "Enable AlmaLinux Plus repo"
  community.general.ini_file:
    path:       /etc/yum.repos.d/almalinux-plus.repo
    section:    plus
    option:     enabled
    value:      1
    create:     no
  when: ansible_distribution == "AlmaLinux" and ansible_architecture == "aarch64"


- import_tasks: rpm_repos.yml

# No kernel*/kmod* exclusion: images ship the newest kernel their distro offers.
# The guest has already rebooted into it before this playbook started, and the
# kernel role asserts as much before any role builds a kernel module.
- name: perform a yum update
  yum:
    name: '*'
    state: latest
    lock_timeout: 60

- name: enable opennebula addons repo
  yum:
    name: "almalinux-release-opennebula-addons"
    state: present
  when: ansible_distribution == "AlmaLinux" and ansible_architecture == "aarch64"

- name: install baseline dependencies
  yum:
    name: "{{ rpms }}"
    state: present
    lock_timeout: 60

- name: install extra rpms
  yum:
    name: "{{ extra_rpms.split() }}"
    state: present
    lock_timeout: 60

- name: disable opennebula addons repo
  yum:
    name: "almalinux-release-opennebula-addons"
    state: absent
  when: ansible_distribution == "AlmaLinux" and ansible_architecture == "aarch64"