---
# Read-only. The upgrade that installs a newer kernel runs before this playbook,
# in scripts/upgrade-kernel.sh — see main.yml for why it cannot run here.

# Register a FAMILY-SPECIFIC variable, never a shared one: main.yml imports both
# redhat.yml and debian.yml, and a skipped task still runs its `register`,
# clobbering a shared name with a stdout-less skip result. rpm's
# %{VERSION}-%{RELEASE}.%{ARCH} matches the `uname -r` form ansible_kernel
# reports, so the two compare directly. sort -V is required: lexically,
# 5.14.0-99 would beat 5.14.0-570.
- name: Find the newest installed kernel
  shell: >-
    set -o pipefail;
    rpm -q kernel-core
    --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort -V | tail -1
  args:
    executable: /bin/bash
  register: _newest_kernel_el
  changed_when: false
