---
# Verify the guest booted the newest kernel its distro offers, before anything
# builds a kernel module.
#
# The upgrade and the reboot happen BEFORE this playbook runs, in packer's
# scripts/upgrade-kernel.sh and the reboot provisioner beside it. They cannot
# happen here: packer's ansible provisioner proxies every task through packer's
# own SSH connection to the guest, and a reboot kills that connection
# mid-playbook. The proxy keeps answering keepalives afterwards, so the task
# ansible has in flight never returns — and because wait_for_connection only
# checks its timeout between attempts, an attempt that never returns means the
# build hangs indefinitely instead of failing. That is not a theory; it is what
# this role used to do.
#
# Every kmod build in this playbook (cni's OVS datapath DKMS, DOCA/OFED, NVIDIA,
# DDN lustre, VAST) targets the RUNNING kernel, and several roles install headers
# pinned to `ansible_kernel`. sysprep asserts the same invariant, but only at the
# very end — this one fails the build before a single module is built against a
# kernel the image will not boot.
#
# Immutable/atomic families (Photon) fall through both imports and end up with
# an empty result, which is treated as nothing to check.

- import_tasks: redhat.yml
  when: ansible_os_family == "RedHat" or ansible_os_family == "Rocky"

- import_tasks: debian.yml
  when: ansible_os_family == "Debian"

# Coalesce the family-specific results. redhat.yml and debian.yml deliberately
# register different variables: the skipped family's task still runs its
# `register` and would clobber a shared name with a stdout-less skip result
# (that is exactly what leaves EL builds with newest=empty -> check skipped).
# The skipped family's variable has no .stdout, so `| default(...)` falls
# through to the one that actually ran.
- name: Determine the newest installed kernel
  set_fact:
    _newest_kernel_str: >-
      {{ (_newest_kernel_el.stdout | default(_newest_kernel_deb.stdout | default('')))
         | trim }}

- name: Report the kernel state
  debug:
    msg: >-
      running={{ ansible_kernel }}
      newest={{ _newest_kernel_str | default('n/a') }}

- name: Fail when the running kernel is not the newest installed
  assert:
    that:
      - _newest_kernel_str == ansible_kernel
    fail_msg: >-
      running kernel {{ ansible_kernel }} is not the newest installed
      ({{ _newest_kernel_str }}). The pre-playbook kernel upgrade
      (scripts/upgrade-kernel.sh) or the reboot provisioner after it did not
      take effect, so every kernel module built from here on would target a
      kernel this image does not boot.
    quiet: true
  when: _newest_kernel_str | length > 0
