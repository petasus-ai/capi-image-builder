# Keep GPU discovery under the driver installer's control on every image.
# These functions run in subshells so word splitting never expands wildcards.
_gpu_strip_args() (
    set -f
    for _gpu_arg in $1; do
        case "$_gpu_arg" in
            modprobe.blacklist=*|nouveau.modeset=*) ;;
            *) printf '%s ' "$_gpu_arg" ;;
        esac
    done
)
_gpu_merge_blacklist() (
    set -f
    _gpu_modules=nouveau,amdgpu
    for _gpu_arg in $1 $2; do
        case "$_gpu_arg" in
            modprobe.blacklist=*)
                _gpu_old_ifs=$IFS
                IFS=,
                for _gpu_module in ${_gpu_arg#*=}; do
                    case ",$_gpu_modules," in
                        *",$_gpu_module,"*) ;;
                        *) _gpu_modules="$_gpu_modules,$_gpu_module" ;;
                    esac
                done
                IFS=$_gpu_old_ifs
                ;;
        esac
    done
    printf '%s' "$_gpu_modules"
)
GRUB_CMDLINE_LINUX="$(_gpu_strip_args "${GRUB_CMDLINE_LINUX:-}")modprobe.blacklist=$(_gpu_merge_blacklist "${GRUB_CMDLINE_LINUX:-}" "${GRUB_CMDLINE_LINUX_DEFAULT:-}") nouveau.modeset=0"
GRUB_CMDLINE_LINUX_DEFAULT="$(_gpu_strip_args "${GRUB_CMDLINE_LINUX_DEFAULT:-}")"
unset -f _gpu_strip_args _gpu_merge_blacklist
