# On Ubuntu the mlx5_ib / RDMA in-tree modules ship in linux-modules-extra, not
# the base linux-modules. openibd (restarted at the end of the role) fails to
# load mlx5_ib without them. The build already rebooted into the newest kernel
# before the playbook started, so install the extras for THAT kernel — the RHEL path pins
# kernel-modules-extra-<running> the same way.
- name: Install linux-modules-extra for the running kernel
  apt:
    name: "linux-modules-extra-{{ ansible_kernel }}"
    state: present
    update_cache: yes

- name: Ensure apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# The published doca_keyring.gpg is already a binary OpenPGP keyring, so it is
# what signed-by wants verbatim — the dearmor round-trip this replaces was a
# no-op wrapped in three tasks of conditional retry logic, one of which had
# ignore_errors set and so let a missing key through to surface later as an
# unrelated apt failure.
- name: Download DOCA repository keyring (binary OpenPGP keyring; do not dearmor)
  get_url:
    url: "{{ doca_base_url }}{{ _doca_keyring_file }}"
    dest: "{{ _trusted_key_path }}"
    mode: '0644'
    force: yes

- name: Create apt source file for DOCA
  copy:
    dest: "{{ _sources_list }}"
    content: "deb [signed-by={{ _trusted_key_path }}] {{ doca_base_url }} ./\n"
    owner: root
    group: root
    mode: '0644'

- name: Install DOCA OFED package
  apt:
    name: "{{ doca_ofed_package }}"
    state: present
    update_cache: yes
