---
- name: Build distro string from OS facts
  set_fact:
    distro_string: >-
      {%- if ansible_distribution | lower == 'ubuntu' -%}
        ubuntu{{ ansible_distribution_version | trim | regex_replace('\n', '') }}
      {%- elif ansible_os_family | lower == 'redhat' -%}
        rhel{{ ansible_distribution_major_version | trim | regex_replace('\n', '') }}
      {%- else -%}
        unsupported
      {%- endif %}

- name: Detect architecture string to use in repo path
  set_fact:
    arch_detect_raw: "{{ (ansible_facts['architecture'] | default(ansible_architecture)) | lower() }}"

- name: Map detected architecture to repo directory
  set_fact:
    arch_repo: >-
      {%- set a = arch_detect_raw | trim -%}
      {%- if a in ['x86_64','amd64','i386','i686'] -%}
      x86_64
      {%- elif a in ['aarch64','arm64'] -%}
      arm64-sbsa
      {%- else -%}
      unknown
      {%- endif -%}

- name: Fail if distro is unsupported
  fail:
    msg: "The OS {{ ansible_distribution }} {{ ansible_distribution_version }} is not supported."
  when: distro_string == "unsupported"

- name: Fail if arch is unsupported
  fail:
    msg: "The architecture {{ arch_repo }} is not supported."
  when: arch_repo == "unknown"

- name: Config base URL
  set_fact:
    doca_base_url: "{{ doca_base_prefix }}/{{ doca_version }}/{{ distro_string }}/{{ arch_repo }}/"

- name: Show DOCA base URL
  debug:
    msg: "The DOCA base URL {{ doca_base_url }}"

- import_tasks: debian.yml
  when: ansible_os_family == "Debian"

- import_tasks: redhat.yml
  when: ansible_os_family == "RedHat"

# Not fatal on purpose: this is the very call that fails when a module is still
# pinned (see files/mlx-modules-ensure.sh), and letting it abort the build would
# make the image unbuildable for the reason the repair script exists to handle.
# The script runs right after and reports whether the stack actually came back.
- name: Restart openibd
  command: /etc/init.d/openibd restart
  register: openibd_restart
  changed_when: openibd_restart.rc == 0
  # The init script only ever exits 0 or 1, so the exit code alone cannot tell
  # the pinned-module abort from a driver that failed to load. Discriminate on
  # the reason instead: rm_mod() echoes rmmod's "... is in use" to stdout. Every
  # other failure -- Loading HCA driver and Access Layer FAILED, active VFs, a
  # missing mod_load_funcs -- still fails the build.
  failed_when: openibd_restart.rc != 0 and 'is in use' not in openibd_restart.stdout

# The init script prints its diagnostic on stdout, not stderr -- rm_mod() in
# /usr/share/mlnx_ofed/mod_load_funcs captures the rmmod error and echoes it,
# and nothing in that file writes to fd 2. Reading stderr here would report the
# failure with no reason attached.
- name: Report openibd restart failure
  debug:
    msg: >-
      openibd restart exited {{ openibd_restart.rc | default('?') }}:
      {{ (openibd_restart.stdout | default('')) | trim | truncate(400) }}
      {{ openibd_restart.msg | default('') }}
  when: openibd_restart.rc | default(1) != 0

# openibd unloads the OFED stack before loading it, and aborts when sunrpc is
# already pinned -- leaving Mellanox functions either bound to no driver or on
# mlx5_core with no mlx5_ib. It is a boot race, so it hits only some nodes of a
# cluster; see files/mlx-modules-ensure.sh for the full failure mode.
- name: Install Mellanox module reload script
  copy:
    src: mlx-modules-ensure.sh
    dest: /usr/local/sbin/mlx-modules-ensure.sh
    owner: root
    group: root
    mode: '0755'

- name: Install mlx-modules-ensure systemd unit
  copy:
    src: mlx-modules-ensure.service
    dest: /etc/systemd/system/mlx-modules-ensure.service
    owner: root
    group: root
    mode: '0644'

- name: Enable mlx-modules-ensure unit
  systemd:
    name: mlx-modules-ensure
    enabled: yes
    daemon_reload: yes

# The openibd restart above can leave the build host in exactly the state this
# script repairs, so run it here too rather than shipping an image whose driver
# stack is half torn down. Mirrors the ofa-kernel-normalize task below.
- name: Reload Mellanox modules at image build time
  command: /usr/local/sbin/mlx-modules-ensure.sh
  register: mlx_modules_ensure
  changed_when: "'nothing to do' not in mlx_modules_ensure.stdout"
  failed_when: false

# Non-zero means a device was left without a working interface. Not fatal --
# module state does not persist into the image -- but it must not pass silently,
# which is the whole point of the script exiting non-zero.
- name: Report Mellanox reload failure
  debug:
    msg: >-
      mlx-modules-ensure exited {{ mlx_modules_ensure.rc | default('?') }}:
      {{ (mlx_modules_ensure.stdout | default('')) | trim | truncate(400) }}
      {{ mlx_modules_ensure.msg | default('') }}
  when: mlx_modules_ensure.rc | default(1) != 0

# DOCA-OFED >= 3.4 leaves absolute symlinks under /usr/src/ofa_kernel that
# dangle inside the GPU operator driver container (useHostMofed) and break
# the nvidia-peermem build. Normalize them to relative links on every boot;
# see files/ofa-kernel-normalize.sh for details.
- name: Install ofa_kernel symlink normalization script
  copy:
    src: ofa-kernel-normalize.sh
    dest: /usr/local/sbin/ofa-kernel-normalize.sh
    owner: root
    group: root
    mode: '0755'

- name: Install ofa-kernel-normalize systemd unit
  copy:
    src: ofa-kernel-normalize.service
    dest: /etc/systemd/system/ofa-kernel-normalize.service
    owner: root
    group: root
    mode: '0644'

- name: Enable ofa-kernel-normalize unit
  systemd:
    name: ofa-kernel-normalize
    enabled: yes
    daemon_reload: yes

- name: Normalize ofa_kernel symlinks at image build time
  command: /usr/local/sbin/ofa-kernel-normalize.sh
