---
- name: Install base packages (minimal)
  dnf:
    name:
      - libseccomp
      - curl
      - ca-certificates
      - pciutils
      - grubby
    state: present
    lock_timeout: 60

- name: Disable nouveau (modprobe)
  copy:
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    mode: "0644"
    content: |
      blacklist nouveau
      options nouveau modeset=0

- name: Rebuild initramfs (dracut)
  command: dracut -f
  changed_when: true

- name: Install kernel build deps (best-effort for driver install)
  dnf:
    name:
      - kernel-devel
      - kernel-headers
      - gcc
      - gcc-c++
      - make
      - elfutils-libelf-devel
      - dkms
      - perl
    state: present
    lock_timeout: 60
  ignore_errors: yes

- name: Try to relocate the PCI devices for full GPU passthrough
  command: >
    grubby --update-kernel=ALL --args="pci=nocrs,realloc"
