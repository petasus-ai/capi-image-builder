- name: Obtain the Ubuntu build_name
  set_fact:
    hpcx_build_name: "ubuntu{{ ansible_distribution_version }}"
  when:
    - ansible_distribution is defined
    - ansible_distribution | lower == 'ubuntu'
    - ansible_distribution_version is defined

- name: Obtain the RHEL build_name
  set_fact:
    hpcx_build_name: "redhat{{ ansible_distribution_major_version }}"
  when:
    - ansible_facts.os_family is defined
    - ansible_facts.os_family | lower == 'redhat'
    - ansible_distribution_major_version is defined

- name: Set chosen nccl-test vars
  set_fact:
    chosen_nccl_test: "{{ version_map[nvidia_version].nccl_test }}"

- name: Download HPC-X package
  get_url:
    url: https://content.mellanox.com/hpc/hpc-x/{{ hpcx_version }}_cuda{{ version_map[nvidia_version].cuda_major }}/hpcx-{{ hpcx_version }}-gcc-doca_ofed-{{ hpcx_build_name }}-cuda{{ version_map[nvidia_version].cuda_major }}-{{ ansible_architecture }}.tbz
    dest: /tmp/hpcx-{{ hpcx_version }}-gcc-doca_ofed-{{ hpcx_build_name }}-cuda{{ version_map[nvidia_version].cuda_major }}-{{ ansible_architecture }}.tbz
    mode: '0644'

- name: Create HPC-X directory
  file:
    path: /opt/hpcx
    state: directory
    mode: '0755'

- name: Extract HPC-X package
  unarchive:
    src: /tmp/hpcx-{{ hpcx_version }}-gcc-doca_ofed-{{ hpcx_build_name }}-cuda{{ version_map[nvidia_version].cuda_major }}-{{ ansible_architecture }}.tbz
    dest: /opt/hpcx
    extra_opts: [--strip-components=1]
    remote_src: yes

- name: Clone NCCL tests repository
  git:
    repo: https://github.com/NVIDIA/nccl-tests
    dest: "{{ ansible_env.HOME }}/nccl-tests"
    version: "{{ chosen_nccl_test }}"

- name: Build NCCL tests
  shell: |
    source /opt/hpcx/hpcx-init.sh && \
    hpcx_load && \
    make CUDA_HOME=/usr/local/cuda NCCL_HOME=/usr MPI=1 MPI_HOME=/opt/hpcx/ompi -j16
  args:
    executable: /bin/bash
    chdir: "{{ ansible_env.HOME }}/nccl-tests"
    creates: "{{ ansible_env.HOME }}/nccl-tests/build"

- name: Ensure NCCL tests directory exists
  file:
    path: /opt/nccl-tests
    state: directory
    mode: '0755'

- name: Create NCCL test script for single node
  copy:
    content: |
      #!/bin/bash
      source /opt/hpcx/hpcx-init.sh && hpcx_load && \
      mpirun -np 8 -N 8 --bind-to none \
      --allow-run-as-root \
      --host 127.0.0.1:8 \
      -x PATH -x LD_LIBRARY_PATH \
      -x NCCL_MIN_NCHANNELS=32 \
      -x CUDA_DEVICE_ORDER=PCI_BUS_ID \
      {{ ansible_env.HOME }}/nccl-tests/build/all_reduce_perf \
      --minbytes 1K --maxbytes 4G --stepfactor 2 --iters 1000 --ngpus 1
    dest: /opt/nccl-tests/nccl-test-single-node.sh
    mode: '0755'

- name: Create HPL test script
  copy:
    content: |
      #!/bin/bash
      cd /opt/nvidia/nvidia_hpc_benchmarks_openmpi
      source /opt/hpcx/hpcx-init.sh && hpcx_load
      source /opt/nvidia/nvidia_hpc_benchmarks_openmpi/hpc-benchmarks-gpu-env.sh
      mpirun -np 8 -N 8 --bind-to none --report-bindings \
      --allow-run-as-root \
      --host 127.0.0.1:8 \
      -x PATH -x LD_LIBRARY_PATH \
      -x UCX_NET_DEVICES=lo -x NCCL_SOCKET_IFNAME=lo \
      -x CUDA_DEVICE_ORDER=PCI_BUS_ID \
      /opt/nvidia/nvidia_hpc_benchmarks_openmpi/hpl.sh --cuda-compat \
      --dat /opt/nvidia/nvidia_hpc_benchmarks_openmpi/hpl-linux-x86_64/sample-dat/HPL-8GPUs.dat
    dest: /opt/nccl-tests/hpl-test.sh
    mode: '0755'
