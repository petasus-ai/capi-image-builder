# Lustre client (DDN build, prebuilt packages; dkms rebuilds against the running kernel):
# https://wiki.lustre.org/Installing_the_Lustre_Software
# The packer upgrade-kernel provisioner already rebooted the guest into the newest
# kernel, so the metapackages below resolve to the running kernel — no pinned kernel
# packages, no equivs dummies, no apt-mark hold. The dkms kernel hook rebuilds lustre
# on node-side kernel upgrades.
# The repo carries prebuilt binary packages, so the transfer is large and the
# guest reaches GitHub through packer's SNAT, which drops long transfers now and
# then (early EOF mid-clone). depth:1 skips the history of superseded packages
# to shrink that window, and since a failed `git clone` removes its destination,
# the retries start clean.
- name: Clone pre-built lustre repository
  git:
    repo: "{{ lustre_repo }}"
    dest: /tmp/prebuilt-lustre
    version: main
    depth: 1
  register: lustre_clone
  retries: 3
  delay: 10
  until: lustre_clone is succeeded

# The dkms deb's kernel Depends is versioned ("linux-image-generic (>= 3.10) | ..."),
# which the cloud image's linux-image-<abi>-generic packages cannot satisfy: they only
# carry an unversioned Provides of the virtual "linux-image". The stock metapackages
# are versioned and track the newest (= running) kernel.
- name: Install lustre dependencies
  apt:
    name:
      - libjson-c-dev
      - libyaml-dev
      - linux-image-generic
      - linux-headers-generic
    state: present
    update_cache: yes

- name: Find lustre dkms module deb files in /tmp folder
  find:
    name: "/tmp/prebuilt-lustre/{{ ansible_distribution }}/{{ ansible_architecture }}/"
    patterns: "lustre-client-modules-dkms_*.deb"
  register: dkms_deb_files

- name: Setting lustre dkms_deb_list
  set_fact:
    dkms_deb_list: "{{ dkms_deb_files.files | map(attribute='path') | list}}"

- name: Install lustre dkms deb package
  apt:
    deb: "{{ item }}"
    state: present
    update_cache: yes
  with_items: "{{ dkms_deb_list }}"

- name: Find lustre client utils deb files in /tmp folder
  find:
    name: "/tmp/prebuilt-lustre/{{ ansible_distribution }}/{{ ansible_architecture }}/"
    patterns: "lustre-client-utils_*.deb"
  register: utils_deb_files

- name: Setting lustre utils_deb_list
  set_fact:
    utils_deb_list: "{{ utils_deb_files.files | map(attribute='path') | list}}"

- name: Install lustre client utils deb package
  apt:
    deb: "{{ item }}"
    state: present
    update_cache: yes
  with_items: "{{ utils_deb_list }}"

- name: Find lustre userspace deb files in /tmp folder
  find:
    name: "/tmp/prebuilt-lustre/{{ ansible_distribution }}/{{ ansible_architecture }}/"
    patterns: "*.deb"
    excludes:
      - "lustre-client-modules-dkms_*.deb"
      - "lustre-client-utils_*.deb"
  register: deb_files

- name: Setting lustre userspace deb_list
  set_fact:
    deb_list: "{{ deb_files.files | map(attribute='path') | list}}"

- name: Install lustre client deb packages
  apt:
    deb: "{{ item }}"
    state: present
    update_cache: yes
  with_items: "{{ deb_list }}"

- name: Remove pre-built lustre directory
  file:
    path: /tmp/prebuilt-lustre
    state: absent
