# Lustre client (DDN build, prebuilt packages; dkms rebuilds against the running kernel):
# https://wiki.lustre.org/Installing_the_Lustre_Software
- name: Install lustre dependencies
  yum:
    name: "{{ item }}"
    state: present
    disable_gpg_check: yes
  with_items:
  - json-c-devel
  - libyaml-devel
  - git

# The repo carries prebuilt binary packages, so the transfer is large and the
# guest reaches GitHub through packer's SNAT, which drops long transfers now and
# then (early EOF mid-clone). depth:1 skips the history of superseded packages
# to shrink that window, and since a failed `git clone` removes its destination,
# the retries start clean.
- name: Clone pre-built lustre repository
  git:
    repo: "{{ lustre_repo }}"
    dest: /tmp/prebuilt-lustre
    version: main
    depth: 1
  register: lustre_clone
  retries: 3
  delay: 10
  until: lustre_clone is succeeded

- name: Find lustre dkms module rpm files in /tmp folder
  find:
    name: "/tmp/prebuilt-lustre/{{ ansible_os_family }}-{{ ansible_distribution_major_version }}/{{ ansible_architecture }}/"
    patterns: "lustre-client-dkms-*.rpm"
  register: dkms_rpm_files

- name: Setting lustre dkms_rpm_list
  set_fact:
    dkms_rpm_list: "{{ dkms_rpm_files.files | map(attribute='path') | list}}"

- name: Install lustre dkms rpm modules
  yum:
    name: "{{ dkms_rpm_list }}"
    state: present
    disable_gpg_check: yes

- name: Find lustre client rpm files in /tmp folder
  find:
    name: "/tmp/prebuilt-lustre/{{ ansible_os_family }}-{{ ansible_distribution_major_version }}/{{ ansible_architecture }}/"
    patterns: "lustre-client-*.rpm"
    excludes:
      - "lustre-client-dkms-*.rpm"
      - "lustre-client-devel-*.rpm"
  register: client_rpm_files

- name: Setting lustre client_rpm_list
  set_fact:
    client_rpm_list: "{{ client_rpm_files.files | map(attribute='path') | list}}"

- name: Install lustre client rpm modules
  yum:
    name: "{{ client_rpm_list }}"
    state: present
    disable_gpg_check: yes

- name: Find lustre userspace rpm files in /tmp folder
  find:
    name: "/tmp/prebuilt-lustre/{{ ansible_os_family }}-{{ ansible_distribution_major_version }}/{{ ansible_architecture }}/"
    patterns: "*.rpm"
    excludes:
      - "lustre-client-dkms-*.rpm"
  register: rpm_files

- name: Setting lustre userspace rpm_list
  set_fact:
    rpm_list: "{{ rpm_files.files | map(attribute='path') | list}}"

- name: Install lustre userspace rpm modules
  yum:
    name: "{{ rpm_list }}"
    state: present
    disable_gpg_check: yes

- name: Remove pre-built lustre directory
  file:
    path: /tmp/prebuilt-lustre
    state: absent
