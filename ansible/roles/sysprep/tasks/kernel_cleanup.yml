---
# Remove kernels superseded by the one the image boots.
#
# The build installs the newest kernel and reboots into it before the playbook
# starts (scripts/upgrade-kernel.sh), but kernel packages are install-only: the
# previous kernel stays behind. The existing autoremove steps do not clear it — on Debian the base image's kernel is marked
# manual, and on EL install-only packages are governed by installonly_limit
# rather than autoremove — so it has to be removed explicitly.
#
# Worth doing beyond disk size: every retired kernel keeps generating its own
# CVE matches in the vulnerability report (~1,900 for a single Ubuntu kernel),
# which is noise about a kernel the image will never boot.
#
# Guarded: the running kernel is filtered out by ABI, and an assertion fails the
# build rather than removing it. Set sysprep_remove_old_kernels=false to skip.

- name: Find kernel packages superseded by the running kernel (Debian)
  # ${running%-*} turns 6.8.0-136-generic into the ABI 6.8.0-136, which also
  # matches flavour-less packages of the same kernel (linux-headers-6.8.0-136).
  # Anything left over belongs to a different kernel.
  shell: |
    set -o pipefail
    running=$(uname -r)
    abi=${running%-*}
    dpkg-query -W -f='${Package}\n' 'linux-*' 2>/dev/null \
      | grep -E '^linux-(image|image-unsigned|modules|modules-extra|headers|tools|buildinfo)-[0-9]' \
      | grep -vF "$abi" || true
  args:
    executable: /bin/bash
  register: _old_kernels
  changed_when: false
  when: ansible_os_family == "Debian"

- name: Find kernel packages superseded by the running kernel (EL)
  # rpm's %{VERSION}-%{RELEASE}.%{ARCH} is exactly the `uname -r` string here, so
  # the running kernel's packages can be filtered by a plain match.
  shell: |
    set -o pipefail
    running=$(uname -r)
    rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' 'kernel*' 2>/dev/null \
      | grep -E '^kernel(-core|-modules|-modules-core|-modules-extra|-devel|-headers)?-[0-9]' \
      | grep -vF "$running" || true
  args:
    executable: /bin/bash
  register: _old_kernels_el
  changed_when: false
  when: ansible_os_family == "RedHat"

- name: Collect the removal list
  set_fact:
    _kernels_to_remove: >-
      {{ (_old_kernels.stdout_lines | default([]))
         + (_old_kernels_el.stdout_lines | default([])) }}

- name: Refuse to remove the running kernel
  assert:
    that:
      - _kernels_to_remove | select('search', ansible_kernel) | list | length == 0
    fail_msg: >-
      kernel cleanup would remove the running kernel ({{ ansible_kernel }}):
      {{ _kernels_to_remove | select('search', ansible_kernel) | list }}
    quiet: true

# Safety net against a skipped/failed pre-playbook reboot. This task removes
# every kernel other than the running one, on the premise that the image booted
# the newest. If it did not — a newer kernel is installed but not
# running — that removal would delete the NEWER kernel and ship the old one.
# Abort loudly instead: the running kernel must be the newest installed.
- name: Find the newest installed kernel
  shell: |
    set -o pipefail
    if command -v rpm >/dev/null 2>&1; then
      # kernel-core exists on EL8+; EL7 and Amazon Linux 2 ship a monolithic
      # `kernel` package instead.
      if rpm -q kernel-core >/dev/null 2>&1; then
        rpm -q kernel-core --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n'
      else
        rpm -q kernel --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n'
      fi
    else
      dpkg-query -W -f='${Package}\n' 'linux-image-*' 2>/dev/null \
        | sed -E 's/^linux-image-(unsigned-)?//' | grep -E '^[0-9]'
    fi | sort -V | tail -1
  args:
    executable: /bin/bash
  register: _newest_installed_kernel
  changed_when: false

- name: Refuse to prune when the running kernel is not the newest installed
  assert:
    that:
      - _newest_installed_kernel.stdout | trim == ansible_kernel
    fail_msg: >-
      running kernel {{ ansible_kernel }} is not the newest installed
      ({{ _newest_installed_kernel.stdout | trim }}) — the pre-playbook reboot
      did not take effect. Aborting so the newer kernel is not deleted.
    quiet: true

- name: Report the kernel cleanup plan
  debug:
    msg: >-
      running={{ ansible_kernel }}
      removing={{ _kernels_to_remove | length }} package(s)
      {{ _kernels_to_remove }}

# Package removal scriptlets regenerate the bootloader config, so the removed
# kernel does not linger as a boot entry.
- name: Purge superseded kernel packages (Debian)
  apt:
    name: "{{ _kernels_to_remove }}"
    state: absent
    purge: yes
    autoremove: yes
    force_apt_get: yes
  when:
    - ansible_os_family == "Debian"
    - _kernels_to_remove | length > 0

- name: Remove superseded kernel packages (EL)
  yum:
    name: "{{ _kernels_to_remove }}"
    state: absent
    autoremove: no
    lock_timeout: 60
  when:
    - ansible_os_family == "RedHat"
    - _kernels_to_remove | length > 0

- name: Verify the running kernel survived
  shell: |
    set -o pipefail
    if [ -d /boot ]; then ls /boot | grep -c "$(uname -r)" || true; fi
  args:
    executable: /bin/bash
  register: _running_kernel_files
  changed_when: false
  failed_when: _running_kernel_files.stdout | trim | int == 0
