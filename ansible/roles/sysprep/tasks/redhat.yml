---
- name: Define file modes
  set_fact:
    last_log_mode:   "0644"
    machine_id_mode: "0444"

- import_tasks: rpm_repos.yml

# Oracle Linux does not have temp-disk-swapfile service
- name: Disable swap service and ensure it is masked
  systemd:
    name: temp-disk-swapfile
    enabled: no
    masked: yes
  when: ansible_memory_mb.swap.total != 0 and ansible_distribution_major_version|int <= 7

- name: Disable swap service and ensure it is masked on RHEL 8
  systemd:
    name: swap.target
    enabled: no
    masked: yes
  when: ansible_memory_mb.swap.total != 0 and ansible_distribution_major_version|int == 8

- name: Remove RHEL subscription
  block:
    - name: Remove subscriptions
      rhsm_repository:
        name: '*'
        state: absent
    - name: Unregister system
      redhat_subscription:
        state: absent
    - name: clean local subscription data
      command: subscription-manager clean
  when: ansible_distribution == "RedHat"

- name: Remove yum package caches
  yum:
    autoremove: yes
    lock_timeout: 60

- name: Remove yum package lists
  command: /usr/bin/yum -y clean all

- name: Reset network interface IDs
  shell: sed -i '/^\(HWADDR\|UUID\)=/d' /etc/sysconfig/network-scripts/ifcfg-*

# cloud-init's NetworkManager renderer wrote a cloud-init-<iface>.nmconnection keyfile
# during the build (DHCP fallback over the QEMU NIC), pinning the build VM's MAC. Drop it;
# tenant cloud-init regenerates one per instance for the real NIC. (netplan leftovers are
# handled generically by main.yml.)
- name: Find cloud-init build-time NetworkManager profiles
  find:
    paths: /etc/NetworkManager/system-connections
    patterns: 'cloud-init-*.nmconnection'
  register: ci_nm_profiles

- name: Remove cloud-init build-time NetworkManager profiles
  file:
    state: absent
    path: "{{ item.path }}"
  loop: "{{ ci_nm_profiles.files }}"

- name: Remove the kickstart log
  file:
    state: absent
    path: /root/anaconda-ks.cfg
