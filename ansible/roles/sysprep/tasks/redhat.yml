---
- name: Define file modes
  set_fact:
    last_log_mode:   "0644"
    machine_id_mode: "0444"

- import_tasks: rpm_repos.yml

# Oracle Linux does not have temp-disk-swapfile service
- name: Disable swap service and ensure it is masked
  systemd:
    name: temp-disk-swapfile
    enabled: no
    masked: yes
  when: ansible_memory_mb.swap.total != 0 and ansible_distribution_major_version|int <= 7

- name: Disable swap service and ensure it is masked on RHEL 8
  systemd:
    name: swap.target
    enabled: no
    masked: yes
  when: ansible_memory_mb.swap.total != 0 and ansible_distribution_major_version|int == 8

- name: Remove RHEL subscription
  block:
    - name: Remove subscriptions
      rhsm_repository:
        name: '*'
        state: absent
    - name: Unregister system
      redhat_subscription:
        state: absent
    - name: clean local subscription data
      command: subscription-manager clean
  when: ansible_distribution == "RedHat"

# The Rocky 9 GenericCloud base bakes net.ifnames=0 biosdevname=0 into the kernel
# cmdline, naming NICs eth0 while CAPK tenant networkdata targets enp1s0. Strip
# the tokens after every kernel-touching step; no in-build reboot — the build's
# NM profile is pinned to eth0. Rocky 10 GenericCloud ships without these tokens.
- name: Ensure grubby is present for kernel cmdline edits
  package:
    name: grubby
    state: present

- name: Remove net.ifnames/biosdevname from all boot loader entries
  command: grubby --update-kernel=ALL --remove-args="net.ifnames biosdevname"
  changed_when: true

- name: Check for GRUB defaults file
  stat:
    path: /etc/default/grub
  register: grub_defaults

- name: Remove net.ifnames/biosdevname from GRUB defaults
  replace:
    path: /etc/default/grub
    regexp: '\s*\b(net\.ifnames|biosdevname)=[^\s"]*'
    replace: ''
  when: grub_defaults.stat.exists

- name: Check for kernel-install cmdline file
  stat:
    path: /etc/kernel/cmdline
  register: kernel_cmdline_file

- name: Remove net.ifnames/biosdevname from kernel-install cmdline
  replace:
    path: /etc/kernel/cmdline
    regexp: '\s*\b(net\.ifnames|biosdevname)=[^\s"]*'
    replace: ''
  when: kernel_cmdline_file.stat.exists

- name: Remove yum package caches
  yum:
    autoremove: yes
    lock_timeout: 60

- name: Remove yum package lists
  command: /usr/bin/yum -y clean all

- name: Reset network interface IDs
  shell: sed -i '/^\(HWADDR\|UUID\)=/d' /etc/sysconfig/network-scripts/ifcfg-* 2>/dev/null || true
  changed_when: true

# cloud-init's NetworkManager renderer wrote a cloud-init-<iface>.nmconnection keyfile
# during the build (DHCP fallback over the QEMU NIC), pinning the build VM's MAC. Drop it;
# tenant cloud-init regenerates one per instance for the real NIC. (netplan leftovers are
# handled generically by main.yml.)
- name: Find cloud-init build-time NetworkManager profiles
  find:
    paths: /etc/NetworkManager/system-connections
    patterns: 'cloud-init-*.nmconnection'
  register: ci_nm_profiles

- name: Remove cloud-init build-time NetworkManager profiles
  file:
    state: absent
    path: "{{ item.path }}"
  loop: "{{ ci_nm_profiles.files }}"

# Base-image profiles pinned to eth0 can never bind once naming is predictable.
# Deleting the files leaves the build's active eth0 connection up (no `nmcli con
# reload` — this SSH session rides on eth0).
- name: Remove legacy eth0 ifcfg profile
  file:
    state: absent
    path: /etc/sysconfig/network-scripts/ifcfg-eth0

- name: Find NetworkManager keyfiles pinned to eth0
  find:
    paths: /etc/NetworkManager/system-connections
    patterns: '*.nmconnection'
    contains: '^interface-name=eth0$'
  register: eth0_nm_profiles

- name: Remove NetworkManager keyfiles pinned to eth0
  file:
    state: absent
    path: "{{ item.path }}"
  loop: "{{ eth0_nm_profiles.files }}"

- name: Remove the kickstart log
  file:
    state: absent
    path: /root/anaconda-ks.cfg
