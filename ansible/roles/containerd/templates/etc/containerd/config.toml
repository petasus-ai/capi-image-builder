## template: jinja
{#
  pause_image arrives as a packer extra-var, which outranks every other
  precedence level -- a task cannot shadow it. tasks/pause.yml therefore
  publishes what kubeadm actually pulls under a separate name and we prefer
  that here, falling back to the configured default on the first render (which
  happens before kubeadm is installed).
#}
{% set sandbox_pause_image = pause_image_effective | default(pause_image) %}

{% if containerd_version is version('2.0.0', '>=') %}
# Not a literal: tasks/main.yml asks the installed binary which version it
# writes by default and publishes it here. containerd rejects a conf.d drop-in
# newer than the root config, and the drop-in writers follow the binary, so the
# root has to track it -- 2.0-2.2 say 3, 2.3 and later say 4. Undefined here
# means the query task did not run, and failing the render is the point: a
# blank version silently produces a config containerd cannot parse.
version = {{ containerd_config_version }}
{% else %}
# Use config version 2 to enable new configuration fields.
# Config file is parsed as version 1 by default.
version = 2
{% endif %}

{% if 'imports' not in containerd_additional_settings | b64decode %}
imports = ["/etc/containerd/conf.d/*.toml"]
{% endif %}

[plugins]
{% if containerd_version is version('2.0.0', '>=') %}
  [plugins.'io.containerd.cri.v1.images'.pinned_images]
    sandbox = "{{ sandbox_pause_image }}"
  # registry.mirrors/registry.configs were removed in containerd 2.0;
  # per-registry endpoints and TLS options come from certs.d hosts.toml
  # files under config_path (see the harbor hosts.toml in this role).
  [plugins.'io.containerd.cri.v1.images'.registry]
    config_path = '/etc/containerd/certs.d'
{% if kubernetes_semver is version('v1.21.0', '>=') %}
  [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc]
    runtime_type = 'io.containerd.runc.v2'
  [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc.options]
    SystemdCgroup = true
{% endif %}
{% else %}
  [plugins."io.containerd.grpc.v1.cri"]
    sandbox_image = "{{ sandbox_pause_image }}"
  [plugins."io.containerd.grpc.v1.cri".registry]
      [plugins."io.containerd.grpc.v1.cri".registry.mirrors]
        [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
          endpoint = ["https://registry-1.docker.io"]
        [plugins."io.containerd.grpc.v1.cri".registry.mirrors."edgestack.harbor.core:32443"]
          endpoint = ["https://edgestack.harbor.core:32443"]
        [plugins."io.containerd.grpc.v1.cri".registry.configs."edgestack.harbor.core:32443".tls]
          insecure_skip_verify = true
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
    runtime_type = "io.containerd.runc.v2"
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
    SystemdCgroup = true
{% if packer_builder_type.startswith('azure') %}
  [plugins."io.containerd.grpc.v1.cri".registry.headers]
    X-Meta-Source-Client = ["azure/capz"]
{% endif %}
{% endif %}

{{containerd_additional_settings | b64decode}}
