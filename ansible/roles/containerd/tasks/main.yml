---
- import_tasks: debian.yml
  when: ansible_os_family == "Debian"

- import_tasks: redhat.yml
  when: ansible_os_family == "RedHat" or ansible_os_family == "Rocky"

# TODO(vincepri): Use deb/rpm packages once available.
# See https://github.com/containerd/containerd/issues/1508 for context.
- name: Download containerd checksum
  get_url:
    url: "{{ containerd_sha256 }}"
    dest: /tmp/containerd.tar.gz.sha256sum
    mode: 0600

- name: Register checksum value for containerd
  shell: cat /tmp/containerd.tar.gz.sha256sum | awk '{ print $1 }'
  register: csum

- name: download containerd
  vars:
    sha256: "{{ csum.stdout }}"
  get_url:
    url: "{{ containerd_url }}"
    checksum: "sha256:{{ sha256 }}"
    dest: /tmp/containerd.tar.gz
    mode: 0600

# containerd release tarballs (>= 2.0) ship only the containerd binaries; the
# systemd unit and runc are published separately (the cri-containerd-cni
# bundle that used to carry them was discontinued with containerd 2.0).
- name: Download containerd.service
  get_url:
    url: "{{ containerd_service_url }}"
    dest: /tmp/containerd.service
    mode: 0600

- name: Download runc
  get_url:
    url: "{{ containerd_runc_url }}"
    checksum: "sha256:{{ containerd_runc_checksum_url }}"
    dest: /tmp/runc
    mode: 0600

- name: Create a directory if it does not exist
  file:
    path: "{{ sysusr_prefix }}/bin"
    state: directory
    mode: 0755

# The release tarball is rooted at bin/, so binaries land in /usr/local/bin.
- name: unpack containerd
  unarchive:
    remote_src: True
    src: /tmp/containerd.tar.gz
    dest: /usr/local
    extra_opts:
      - --no-overwrite-dir

- name: Copy containerd.service to /etc/systemd/system
  copy:
    remote_src: True
    src: /tmp/containerd.service
    dest: /etc/systemd/system/containerd.service
    mode: 0644

- name: Copy runc to /usr/local/sbin
  copy:
    remote_src: True
    src: /tmp/runc
    dest: /usr/local/sbin/runc
    mode: 0755

- name: Creates unit file directory
  file:
    path: /etc/systemd/system/containerd.service.d
    state: directory

- name: Create containerd memory pressure drop in file
  template:
    dest: /etc/systemd/system/containerd.service.d/memory-pressure.conf
    src: etc/systemd/system/containerd.service.d/memory-pressure.conf
    mode: 0644

- name: Create containerd max tasks drop in file
  template:
    dest: /etc/systemd/system/containerd.service.d/max-tasks.conf
    src: etc/systemd/system/containerd.service.d/max-tasks.conf
    mode: 0644

- name: Create containerd http proxy conf file if needed
  template:
    dest: /etc/systemd/system/containerd.service.d/http-proxy.conf
    src: etc/systemd/system/containerd.service.d/http-proxy.conf
    mode: 0644
  when: http_proxy is defined or https_proxy is defined

- name: Creates containerd config directory
  file:
    path: /etc/containerd
    state: directory

- name: Creates containerd extra config directory
  file:
    path: /etc/containerd/conf.d
    state: directory

# containerd 2.0 removed the CRI registry.mirrors/registry.configs settings;
# per-registry endpoints and TLS options now live in certs.d hosts.toml files
# referenced by the registry config_path in config.toml.
- name: Creates containerd registry host config directory for harbor
  file:
    path: "/etc/containerd/certs.d/edgestack.harbor.core:32443"
    state: directory

- name: Copy in harbor registry hosts.toml
  template:
    dest: "/etc/containerd/certs.d/edgestack.harbor.core:32443/hosts.toml"
    src: etc/containerd/certs.d/hosts.toml
    mode: 0644

# containerd refuses a root config newer than the binary understands, and
# equally refuses a conf.d drop-in newer than the root config. The producers of
# those drop-ins ask the binary (nvidia-container-toolkit, shipped by the GPU
# operator, writes at the binary's native version), so the root config has to
# sit exactly at that native version -- which moved from 3 to 4 in containerd
# 2.3 and left GPU nodes in a containerd restart loop when the template still
# said 3.
#
# Asked of the binary rather than mapped from containerd_version in the
# template: a version map is one more pin to revisit on every containerd bump,
# and it is exactly the pin that was wrong. Only 2.x is asked -- `config
# default` prints the highest version it supports there, while 1.x deliberately
# prints 1 even though the CRI fields need 2.
- name: Ask containerd which config version it writes
  shell: >-
    set -o pipefail &&
    {{ sysusrlocal_prefix }}/bin/containerd config default
    | awk -F'[ =]+' '/^version/ { found = $2 } END { print found }'
  args:
    executable: /bin/bash
  register: containerd_default_config_version
  changed_when: false
  when: containerd_version is version('2.0.0', '>=')

# Published as a fact so the later re-render in tasks/pause.yml sees the same
# value; that include runs pause.yml alone and never revisits this file.
- name: Publish the config version containerd should declare
  set_fact:
    containerd_config_version: "{{ containerd_default_config_version.stdout | trim }}"
  when: containerd_version is version('2.0.0', '>=')

- name: Copy in containerd config file {{ containerd_config_file }}
  template:
    dest: /etc/containerd/config.toml
    src: "{{ containerd_config_file }}"
    mode: 0644

- name: Copy in crictl config
  template:
    dest: /etc/crictl.yaml
    src: etc/crictl.yaml

- name: start containerd service
  systemd:
    name: containerd
    daemon_reload: yes
    enabled: True
    state: restarted

- name: delete tarball
  file:
    path: /tmp/containerd.tar.gz
    state: absent

- name: delete containerd.service download
  file:
    path: /tmp/containerd.service
    state: absent

- name: delete runc download
  file:
    path: /tmp/runc
    state: absent
