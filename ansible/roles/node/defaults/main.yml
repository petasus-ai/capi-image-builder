---
common_rpms:
- audit
- ca-certificates
- conntrack-tools
- chrony
- curl
- jq
- python3-pip
- socat
- sysstat
- yum-utils

# Used for RedHat based distributions ==  8 (ex. RHEL-8, RockyLinux-8 etc.)
rh8_rpms:
- nftables
- python3-netifaces
- python3-requests

common_debs:
- auditd
- apt-transport-https
- conntrack
- chrony
- curl
- ebtables
- jq
- gnupg
- libnetfilter-acct1
- libnetfilter-cttimeout1
- libnetfilter-log1
# Generic metapackages keep the kernel image and headers current for the DKMS roles.
- linux-image-generic
- linux-headers-generic
- python3-setuptools
- python3-netifaces
- python3-pip
- socat

common_virt_rpms:
- curl

# No linux-cloud-tools-virtual (Hyper-V guest daemons): x86-only, unused on
# KVM/kubevirt guests.
common_virt_debs:
- linux-tools-virtual
- open-vm-tools

sysctl_conf_file: /etc/sysctl.conf

pause_image: "registry.k8s.io/pause:3.10.2"
containerd_additional_settings: null
