---
  - block:
    - include_tasks: el_ovs.yml
      when: ansible_os_family == "Rocky" or ansible_os_family == "RedHat"

    - include_tasks: deb_ovs.yml
      when: ansible_os_family == "Debian" or ansible_os_family == "Ubuntu"

    - include_tasks: el_ipvs.yml
      when: ansible_os_family == "Rocky" or ansible_os_family == "RedHat"

    - include_tasks: deb_ipvs.yml
      when: ansible_os_family == "Debian" or ansible_os_family == "Ubuntu"

    - name: Enable kernel modules
      template:
        src: templates/module.conf.j2
        dest: "/etc/modules-load.d/{{ item.name }}.conf"
      with_items:
      - { name: 'vxlan', kernel_module: 'vxlan' }
      - { name: 'geneve', kernel_module: 'geneve' }
      - { name: 'gre', kernel_module: 'gre' }
      - { name: 'iptables', kernel_module: 'ip_tables' }
      - { name: 'openvswitch', kernel_module: 'openvswitch' }
