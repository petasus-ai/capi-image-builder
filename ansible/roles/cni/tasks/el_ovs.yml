---
  - block:
    - name: Copy OVS kmod rpm file to tmp folder
      copy:
        src: openvswitch-kmod-2.15.3-1.el8.x86_64.rpm
        dest: /tmp/openvswitch-kmod-2.15.3-1.el8.x86_64.rpm

    - name: Install OVS kmod rpm package
      yum:
        name: /tmp/openvswitch-kmod-2.15.3-1.el8.x86_64.rpm
        disable_gpg_check: yes
        state: present
