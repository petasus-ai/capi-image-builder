---
- name: install fail2ban package
  apt:
    name: fail2ban
    state: present
    update_cache: yes

- name: start fail2ban
  service:
    name: fail2ban
    state: started
    enabled: yes

- name: copy ssh fail2ban configuration
  copy:
    src: jail.local
    dest: /etc/fail2ban/jail.local

- name: restart fail2ban
  service:
    name: fail2ban
    state: restarted
