---
- hosts: all
  become: yes

  tasks:
    - include_role:
        name: node
    # Must precede every role that builds a kernel module (cni's OVS datapath
    # DKMS, doca, cuda, ddn, vast) or installs headers pinned to ansible_kernel:
    # it asserts the guest is already running the newest kernel, so those
    # modules are built against the kernel the image will actually boot. The
    # upgrade and reboot that make that true happen before this playbook, in
    # packer's scripts/upgrade-kernel.sh provisioner.
    - include_role:
        name: kernel
    - include_role:
        name: providers
    - include_role:
        name: containerd
    - include_role:
        name: kubernetes
    - include_role:
        name: load_additional_components
      when: load_additional_components | bool
    - include_role:
        name: "{{ role }}"
      loop: "{{ custom_role_names.split() }}"
      loop_control:
        loop_var: role
      when: custom_role | default(false)|bool
    - include_role:
        name: cni
    - include_role:
        name: addons
    - include_role:
        name: security
    - include_role:
        name: customize
    - include_role:
        name: nvidia/doca
      when: accel_provider == "nvidia"
    - include_role:
        name: nvidia/cuda
      when: accel_provider == "nvidia"
    - include_role:
        name: rebellions
      when: accel_provider == "rebellions"
    - include_role:
        name: ddn
      when: accel_provider == "nvidia"
    - include_role:
        name: vast
      when: accel_provider == "nvidia"
    # Last before sysprep: every component must already be installed, and
    # sysprep starts removing the traces the probes read.
    - include_role:
        name: manifest
    - include_role:
        name: sysprep
    # Must stay last: bakes the upgrade freeze (apt pins/holds, dnf excludes)
    # into accelerator images, and once applied, removing frozen packages
    # fails — sysprep's kernel cleanup included. See roles/freeze.
    - include_role:
        name: freeze
      when: accel_provider == "nvidia"

  environment:
    http_proxy: "{{ http_proxy | default('') }}"
    https_proxy: "{{ https_proxy | default('') }}"
    no_proxy: "{{ no_proxy | default('') }}"
    HTTP_PROXY: "{{ http_proxy | default('') }}"
    HTTPS_PROXY: "{{ https_proxy | default('') }}"
    NO_PROXY: "{{ no_proxy | default('') }}"
    PYTHONPATH: "{{ python_path }}"
