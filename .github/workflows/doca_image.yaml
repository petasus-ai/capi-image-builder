name: Build Kube golden images (DOCA)

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Select os to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ubuntu
          - rocky
      kube_version:
        description: "kubernetes version"
        type: string
        required: true
      sbom_strict:
        description: 'Fail the job when the SBOM stage fails (image push is unaffected)'
        required: true
        default: true
        type: boolean
      sbom_force:
        description: 'Regenerate and overwrite the SBOM even if already published'
        required: true
        default: false
        type: boolean
      vuln_strict:
        description: 'Fail the job when the vulnerability stage fails (image/SBOM unaffected)'
        required: true
        default: true
        type: boolean
      vuln_force:
        description: 'Overwrite the vulnerability report regardless of its DB build date'
        required: true
        default: false
        type: boolean
      provenance_strict:
        description: 'Fail the job when signing/attestation fails (image unaffected)'
        required: true
        default: true
        type: boolean
      provenance_force:
        description: 'Re-sign and overwrite an already published signature sidecar'
        required: true
        default: false
        type: boolean
  push:
    tags:
      - v*.*.*
# Per-attempt packer build timeout (generous: DOCA adds a DKMS compile). A stalled SNAT is
# killed at this bound so the job fails fast for a manual re-run.
env:
  PACKER_BUILD_TIMEOUT: "90m"
# id-token: write mints the OIDC token cosign exchanges with Fulcio for a
# keyless signing certificate. Declaring permissions replaces the default token
# scopes for every job in the file; contents: read is all these jobs need from
# GITHUB_TOKEN (mirror pushes use the MY_TOKEN PAT, not GITHUB_TOKEN).
permissions:
  id-token: write
  contents: read
jobs:
  build-ubuntu-2404-doca-amd64:
    if: ${{ github.event.inputs.os == 'ubuntu' || github.event.inputs.os == 'all' }}
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 200
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Activate virtualenv
        run: |
          . /home/rocky/.venv/bin/activate
          echo PATH=$PATH >> $GITHUB_ENV

      - name: Patch K8S Version
        id: patch-version
        run: |
          if [ -z "$KUBE_VERSION" ]
          then
            KUBE_VERSION=$TAG_REF
          fi
          KUBE_PATCH_VERSION=${KUBE_VERSION#v}
          KUBE_MINOR_VERSION=${KUBE_PATCH_VERSION%.*}

          echo "kube-version=$KUBE_VERSION" >> "$GITHUB_OUTPUT"
          echo "kube-minor-version=$KUBE_MINOR_VERSION" >> "$GITHUB_OUTPUT"

          # Resolve the exact deb package revision (e.g. -1.1, -2.1) from the pkgs.k8s.io index
          KUBE_DEB_VERSION=$(curl -sfL "https://pkgs.k8s.io/core:/stable:/v${KUBE_MINOR_VERSION}/deb/Packages" \
            | grep -m1 -oE "^Version: ${KUBE_PATCH_VERSION}-[0-9.]+" | cut -d' ' -f2)
          KUBE_DEB_VERSION=${KUBE_DEB_VERSION:-${KUBE_PATCH_VERSION}-1.1}

          # Patch version fields explicitly so this step does not depend on the
          # baseline version committed in kubernetes.json
          sed -i \
            -e "s|\"kubernetes_deb_version\": \"[^\"]*\"|\"kubernetes_deb_version\": \"${KUBE_DEB_VERSION}\"|" \
            -e "s|\"kubernetes_rpm_version\": \"[^\"]*\"|\"kubernetes_rpm_version\": \"${KUBE_PATCH_VERSION}\"|" \
            -e "s|\"kubernetes_semver\": \"[^\"]*\"|\"kubernetes_semver\": \"v${KUBE_PATCH_VERSION}\"|" \
            -e "s|\"kubernetes_series\": \"[^\"]*\"|\"kubernetes_series\": \"v${KUBE_MINOR_VERSION}\"|" \
            -e "s|\"crictl_version\": \"[^\"]*\"|\"crictl_version\": \"${KUBE_MINOR_VERSION}.0\"|" \
            packer/config/kubernetes.json

          cat packer/config/kubernetes.json
          sed -i "s/\"accel_provider\": \"\"/\"accel_provider\": \"nvidia\"/g" packer/config/common.json
        env:
          KUBE_VERSION: ${{ inputs.kube_version }}
          TAG_REF: ${{ github.ref_name }}

      # Packer's downloader can neither resume nor retry when the caching proxy
      # in front of the upstream mirrors truncates the image mid-transfer, so a
      # bad transfer used to fail the whole build. Fetch a verified copy with
      # curl first (hack/fetch-image.sh, shared byte-identical with
      # edgestack-image-builder — the on-host image cache and its per-image
      # locks are shared with that builder's jobs too) and point Packer at it.
      - name: Fetch cloud image
        run: |
          hack/fetch-image.sh \
            packer/qemu/qemu-ubuntu-2404.json \
            "${RUNNER_TEMP}/iso-override.json"

      - name: Build image
        env:
          # Through the environment, not the command line: the Makefile expands
          # PACKER_VAR_FILES into ABSOLUTE_PACKER_VAR_FILES and appends it after
          # the distro var file, so this override wins iso_url/iso_checksum.
          PACKER_VAR_FILES: ${{ runner.temp }}/iso-override.json
          PACKER_BUILD_TIMEOUT: 120m
        run: make build-qemu-ubuntu-2404

      - name: Create Dockerfile
        run: |
          cat << EOF > output/ubuntu-2404-kube-${{ steps.patch-version.outputs.kube-version }}/Dockerfile
          FROM alpine
          ADD ubuntu-2404-kube-${{ steps.patch-version.outputs.kube-version }} /disk/
          EOF

      - name: Build & push container image
        run: |
          COMPONENTS="$(cat output/ubuntu-2404-kube-${{ steps.patch-version.outputs.kube-version }}/components.json)"
          # Disk geometry travels with the image so a DataVolume author does not
          # have to know packer's disk_size. Packer names the disk after its own
          # output directory and gives it no extension, hence the basename.
          BUILD_DIR="output/ubuntu-2404-kube-${{ steps.patch-version.outputs.kube-version }}"
          DISK="$(scripts/disk-metadata.sh "${BUILD_DIR}/$(basename "${BUILD_DIR}")")"
          # org.opencontainers.image.source is deliberately omitted: it would point at
          # the private builder repo, so the portal would render a link that 404s for
          # every external reader. .revision stays as opaque text for internal audit
          # ("which build produced this image?") without advertising a destination.
          sudo docker build \
            --label "ai.petasus.components=${COMPONENTS}" \
            --label "ai.petasus.disk=${DISK}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${{ steps.patch-version.outputs.kube-version }}-doca-cilium-amd64" \
            --label "org.opencontainers.image.vendor=Petasus AI Cloud" \
            --tag quay.io/edgestack/ubuntu-2404-kube:${{ steps.patch-version.outputs.kube-version }}-doca-cilium-amd64 output/ubuntu-2404-kube-${{ steps.patch-version.outputs.kube-version }}
          sudo docker login quay.io/edgestack -u ${{ secrets.QUAY_USER_NAME }} -p ${{ secrets.QUAY_PASSWORD }}
          sudo docker push quay.io/edgestack/ubuntu-2404-kube:${{ steps.patch-version.outputs.kube-version }}-doca-cilium-amd64

      - name: Create container image manifests
        continue-on-error: true
        uses: ./.github/actions/manifest
        with:
          image: quay.io/edgestack/ubuntu-2404-kube
          tag: ${{ steps.patch-version.outputs.kube-version }}-doca-cilium

      - name: SBOM, vulnerability report and provenance
        uses: ./.github/actions/supply-chain
        with:
          build-dir: output/ubuntu-2404-kube-${{ steps.patch-version.outputs.kube-version }}
          image-repo: ubuntu-2404-kube
          tag: ${{ steps.patch-version.outputs.kube-version }}-doca-cilium-amd64
          mirror-token: ${{ secrets.MY_TOKEN }}
          quay-username: ${{ secrets.QUAY_USER_NAME }}
          quay-password: ${{ secrets.QUAY_PASSWORD }}
          sbom-strict: ${{ github.event.inputs.sbom_strict }}
          sbom-force: ${{ github.event.inputs.sbom_force }}
          vuln-strict: ${{ github.event.inputs.vuln_strict }}
          vuln-force: ${{ github.event.inputs.vuln_force }}
          provenance-strict: ${{ github.event.inputs.provenance_strict }}
          provenance-force: ${{ github.event.inputs.provenance_force }}

