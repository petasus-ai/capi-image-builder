on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Select os to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ubuntu
          - rocky
      kube_version:
        description: "kubernetes version"
        type: string
        required: true
  push:
    tags:
      - v*.*.*
jobs:
  build-ubuntu-2404-amd64:
    if: ${{ github.event.inputs.os == 'ubuntu' || github.event.inputs.os == 'all' }}
    runs-on:
      - self-hosted
      - linux
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate virtualenv
        run: |
          . /home/rocky/.venv/bin/activate
          echo PATH=$PATH >> $GITHUB_ENV

      - name: Patch K8S Version
        id: patch-version
        run: |
          if [ -z "$KUBE_VERSION" ]
          then
            KUBE_VERSION=$TAG_REF
          fi
          KUBE_PATCH_VERSION=${KUBE_VERSION#v}
          KUBE_MINOR_VERSION=${KUBE_PATCH_VERSION%.*}

          echo "kube-version=$KUBE_VERSION" >> "$GITHUB_OUTPUT"
          echo "kube-minor-version=$KUBE_MINOR_VERSION" >> "$GITHUB_OUTPUT"

          # Resolve the exact deb package revision (e.g. -1.1, -2.1) from the pkgs.k8s.io index
          KUBE_DEB_VERSION=$(curl -sfL "https://pkgs.k8s.io/core:/stable:/v${KUBE_MINOR_VERSION}/deb/Packages" \
            | grep -m1 -oE "^Version: ${KUBE_PATCH_VERSION}-[0-9.]+" | cut -d' ' -f2)
          KUBE_DEB_VERSION=${KUBE_DEB_VERSION:-${KUBE_PATCH_VERSION}-1.1}

          # Patch version fields explicitly so this step does not depend on the
          # baseline version committed in kubernetes.json
          sed -i \
            -e "s|\"kubernetes_deb_version\": \"[^\"]*\"|\"kubernetes_deb_version\": \"${KUBE_DEB_VERSION}\"|" \
            -e "s|\"kubernetes_rpm_version\": \"[^\"]*\"|\"kubernetes_rpm_version\": \"${KUBE_PATCH_VERSION}\"|" \
            -e "s|\"kubernetes_semver\": \"[^\"]*\"|\"kubernetes_semver\": \"v${KUBE_PATCH_VERSION}\"|" \
            -e "s|\"kubernetes_series\": \"[^\"]*\"|\"kubernetes_series\": \"v${KUBE_MINOR_VERSION}\"|" \
            -e "s|\"crictl_version\": \"[^\"]*\"|\"crictl_version\": \"${KUBE_MINOR_VERSION}.0\"|" \
            packer/config/kubernetes.json

          cat packer/config/kubernetes.json
        env:
          KUBE_VERSION: ${{ inputs.kube_version }}
          TAG_REF: ${{ github.ref_name }}

      - name: Build image
        run: make build-qemu-ubuntu-2404

      - name: Create Dockerfile
        run: |
          cat << EOF > output/ubuntu-2404-kube-${{ steps.patch-version.outputs.kube-version }}/Dockerfile
          FROM alpine
          ADD ubuntu-2404-kube-${{ steps.patch-version.outputs.kube-version }} /disk/
          EOF

      - name: Build & push container image
        run: |
          sudo docker build --tag quay.io/edgestack/ubuntu-2404-kube:${{ steps.patch-version.outputs.kube-version }}-amd64 output/ubuntu-2404-kube-${{ steps.patch-version.outputs.kube-version }}
          sudo docker login quay.io/edgestack -u ${{ secrets.QUAY_USER_NAME }} -p ${{ secrets.QUAY_PASSWORD }}
          sudo docker push quay.io/edgestack/ubuntu-2404-kube:${{ steps.patch-version.outputs.kube-version }}-amd64

      - name: Create container image manifests
        continue-on-error: true
        run: |
          sudo docker manifest create quay.io/edgestack/ubuntu-2404-kube:${{ steps.patch-version.outputs.kube-version }} \
            quay.io/edgestack/ubuntu-2404-kube:${{ steps.patch-version.outputs.kube-version }}-aarch64 \
            quay.io/edgestack/ubuntu-2404-kube:${{ steps.patch-version.outputs.kube-version }}-amd64 --amend
          sudo docker manifest push quay.io/edgestack/ubuntu-2404-kube:${{ steps.patch-version.outputs.kube-version }} --format v2s2
          sudo docker manifest rm quay.io/edgestack/ubuntu-2404-kube:${{ steps.patch-version.outputs.kube-version }}

  build-rockylinux-9-amd64:
