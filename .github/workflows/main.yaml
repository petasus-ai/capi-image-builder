          sudo docker manifest push quay.io/edgestack/rocky-9-uefi-kube:${{ steps.patch-version.outputs.kube-version }} --format v2s2
          sudo docker manifest rm quay.io/edgestack/rocky-9-uefi-kube:${{ steps.patch-version.outputs.kube-version }}

  build-ubuntu-2404-arm64:
    if: ${{ github.event.inputs.os == 'ubuntu' || github.event.inputs.os == 'all' }}
    runs-on:
      - self-hosted
