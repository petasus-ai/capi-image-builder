name: Auto build on new Kubernetes release

# Dispatches the image builds a new upstream Kubernetes patch requires, so the
# version no longer has to be typed into main.yaml and doca_image.yaml by hand
# once a month.
#
# It builds nothing itself. scripts/pending-kube-builds.py diffs the published
# quay tags against dl.k8s.io and this workflow forwards each gap to the
# workflow that owns it, exactly as a human would have filled the form in. That
# split keeps the build definitions untouched: a version dispatched from here
# and a version dispatched by hand run the identical jobs.
#
# Scope is this branch's image line only (see the -cilium note in the script) —
# the cilium branch carries its own schedule if and when it wants one.
#
# Cost of a false negative is a month of delay; cost of a false positive is
# hours of self-hosted runner time on an image nobody asked for. The script is
# therefore biased to silence: any lookup it cannot complete fails the run
# instead of guessing that nothing is built.

on:
  schedule:
    # 03:37 KST daily. Upstream cuts patches roughly monthly, so almost every
    # run finds nothing and costs one API sweep; checking daily just shortens
    # the worst-case lag from four weeks to one day. Deliberately not on the
    # hour: scheduled runs queue behind everyone else's on-the-hour cron.
    - cron: '37 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Detect only - report what would be built without dispatching'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # workflow_dispatch is one of the two events GITHUB_TOKEN is still allowed to
  # raise (the recursion guard exempts it), so no PAT is needed here.
  actions: write

# Serialised against itself: two overlapping detections would read the same
# registry state and dispatch every build twice.
concurrency:
  group: auto-kube-release
  cancel-in-progress: false

jobs:
  detect-and-dispatch:
    runs-on:
      - self-hosted
      - linux
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect pending builds
        id: detect
        run: |
          set -euo pipefail
          scripts/pending-kube-builds.py > pending.json
          echo "count=$(python3 -c 'import json; print(len(json.load(open("pending.json"))))')" >> "$GITHUB_OUTPUT"

      - name: Summarise
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          pending = json.load(open("pending.json"))
          if not pending:
              print("Every tracked Kubernetes series is already built.")
          else:
              print("| Kubernetes | OS | Workflow | Missing arches |")
              print("|---|---|---|---|")
              for item in pending:
                  print("| {} | {} | {} | {} |".format(
                      item["kube_version"], item["os"], item["workflow"],
                      ", ".join(item["missing"])))
          PY

      - name: Dispatch builds
        if: ${{ steps.detect.outputs.count != '0' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build from the same ref that detected the gap, so a dispatch always
          # runs the workflow definition that was reasoned about.
          REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rc=0
          # A build in flight has not published its tags yet, so the detector
          # still reports its version as missing. On a daily schedule that would
          # re-dispatch the same versions every morning until they finish, and
          # with one runner per arch the queue would only grow. Skipping a
          # workflow that already has work outstanding costs at most a day of
          # delay, which is the same lag the schedule already accepts.
          #
          # Snapshotted before the loop, so the dispatches made below do not
          # make the workflow look busy to their own siblings.
          busy=""
          for workflow in $(python3 -c 'import json; print(" ".join(sorted({i["workflow"] for i in json.load(open("pending.json"))})))'); do
            for state in queued in_progress; do
              runs=$(curl -sS \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPO}/actions/workflows/${workflow}/runs?status=${state}&per_page=1") || runs=""
              # An unreadable answer is treated as busy: re-dispatching a build
              # that is already running is the expensive mistake here.
              count=$(printf '%s' "$runs" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("total_count", 1))' 2>/dev/null || echo 1)
              if [ "$count" != "0" ]; then
                echo "hold  ${workflow}: ${count} run(s) ${state}"
                busy="${busy} ${workflow}"
                break
              fi
            done
          done

          # Read from a file rather than a pipe: a piped while-loop runs in a
          # subshell, where recording a failure would be discarded on exit.
          python3 -c 'import json; [print(i["workflow"], i["os"], i["kube_version"]) for i in json.load(open("pending.json"))]' > dispatch-list
          while read -r workflow os version; do
            case " ${busy} " in
              *" ${workflow} "*)
                echo "skip  ${workflow} ${os} ${version}: already building, retry tomorrow"
                continue
                ;;
            esac
            echo "dispatch ${workflow} os=${os} kube_version=${version}"
            # The strict/force toggles are declared required by the build
            # workflows, so they are sent explicitly at their documented
            # defaults rather than relying on the API to fill them in.
            #
            # curl reports a transport failure as a non-zero exit and no status
            # line; swallowing that into 000 keeps one unreachable call from
            # aborting the whole batch under set -e.
            code=$(curl -sS -o dispatch-response -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${workflow}/dispatches" \
              -d "{\"ref\":\"${REF}\",\"inputs\":{\"os\":\"${os}\",\"kube_version\":\"${version}\",\"sbom_strict\":\"true\",\"sbom_force\":\"false\",\"vuln_strict\":\"true\",\"vuln_force\":\"false\",\"provenance_strict\":\"true\",\"provenance_force\":\"false\"}}") || code="000"
            if [ "$code" != "204" ]; then
              echo "FAIL  ${workflow} ${os} ${version}: HTTP ${code}"
              cat dispatch-response 2>/dev/null || true
              echo
              rc=1
            fi
          done < dispatch-list
          exit $rc

      - name: Report dry run
        if: ${{ steps.detect.outputs.count != '0' && inputs.dry_run == true }}
        run: echo "Dry run - ${{ steps.detect.outputs.count }} dispatch(es) withheld."
