command:
  containerd --version | awk -F' ' '{print substr($3,2); }':
    exit-status: 0
    stdout: []
    stderr: []
    timeout: 0
  crictl ps:
    exit-status: 0
    stdout: []
    stderr: []
    timeout: 0
# The pause image containerd pins for pod sandboxes must be present in the
# local image cache. A miss sends containerd to the upstream registry, which is
# fatal on air-gapped nodes: no pod sandbox can be created, so no static
# control-plane pod starts and kubeadm init dies waiting for the API server.
# That is exactly how the k8s 1.36 bump broke -- pause moved to 3.10.2 while the
# pinned tag stayed at 3.10.1.
#
# Asserted against the pin recorded by containerd/tasks/pause.yml, not against
# the pause_image variable: a build targets whatever patch kube_version names
# (the workflow rewrites kubernetes_semver per run) while pause_image is a
# single static default, so comparing to it would fire on every build of a
# different minor -- pause is 3.10.1 across all of 1.34/1.35 and 3.10.2 from
# 1.36.0 on.
#
# ctr is called by absolute path on purpose: goss runs under sudo, and on EL
# hosts sudoers' secure_path is /sbin:/bin:/usr/sbin:/usr/bin -- so the
# containerd binaries under /usr/local/bin are not on PATH there.
  {{ .Vars.sysusrlocal_prefix }}/bin/ctr -n k8s.io images ls -q | grep -F -f /etc/containerd/pinned-pause-image:
    exit-status: 0
    stdout: ["/pause:"]
    stderr: []
    timeout: 0
# The rendered root config version must equal what `containerd config default`
# prints (drop-ins at a higher version are refused). Absolute path for the same
# secure_path reason as ctr above; POSIX sh only -- goss runs commands through sh.
  test "$(grep '^version' /etc/containerd/config.toml)" = "$({{ .Vars.sysusrlocal_prefix }}/bin/containerd config default | grep '^version')":
    exit-status: 0
    stdout: []
    stderr: []
    timeout: 0
  crictl images | grep -v 'IMAGE ID' | awk -F'[ /]' '{print $2}' | sed 's/-{{ .Vars.arch }}//g' | sort:
    exit-status: 0
    stderr: []
    timeout: 0
    stdout: ["coredns", "etcd", "kube-apiserver", "kube-controller-manager", "kube-proxy", "kube-scheduler", "pause"]
{{if eq .Vars.accel_provider "nvidia"}}
# The boot units ansible/roles/nvidia/doca installs and enables. Asserted with
# is-enabled rather than goss's service resource, which insists on a `running`
# expectation too: all three are oneshot units the build runs by hand, never
# through systemd, so their active state at capture says nothing about a booted
# node. One command per unit, because `systemctl is-enabled a b c` exits 0 when
# any one of them is enabled.
  systemctl is-enabled openibd:
    exit-status: 0
    stdout: ["enabled"]
    stderr: []
    timeout: 0
  systemctl is-enabled mlx-modules-ensure:
    exit-status: 0
    stdout: ["enabled"]
    stderr: []
    timeout: 0
  systemctl is-enabled ofa-kernel-normalize:
    exit-status: 0
    stdout: ["enabled"]
    stderr: []
    timeout: 0
{{end}}
{{range $name, $vers := index .Vars .Vars.OS .Vars.PROVIDER "command"}}
  {{ $name }}:
  {{range $key, $val := $vers}}
    {{$key}}: {{$val}}
  {{end}}
{{end}}
