command:
# The boot disk's filesystems mount by UUID, never by a label another disk can carry.
  for m in / /boot /boot/efi; do s=$(awk -v m=$m '$1 !~ /^#/ && $2 == m {print $1}' /etc/fstab); d=$(blkid -U "${s#UUID=}"); [ "${s#UUID=}" != "$s" ] && [ -n "$d" ] && [ "$d" = "$(findmnt -no SOURCE $m)" ] || exit 1; done:
    exit-status: 0
    stdout: []
    stderr: []
    timeout: 0
  containerd --version | awk -F' ' '{print substr($3,2); }':
    exit-status: 0
    stdout: []
    stderr: []
    timeout: 0
  crictl ps:
    exit-status: 0
    stdout: []
    stderr: []
    timeout: 0
# The pause image containerd pins for pod sandboxes must be present in the
# local image cache. A miss sends containerd to the upstream registry, which is
# fatal on air-gapped nodes: no pod sandbox can be created, so no static
# control-plane pod starts and kubeadm init dies waiting for the API server.
# That is exactly how the k8s 1.36 bump broke -- pause moved to 3.10.2 while the
# pinned tag stayed at 3.10.1.
#
# Asserted against the pin recorded by containerd/tasks/pause.yml, not against
# the pause_image variable: a build targets whatever patch kube_version names
# (the workflow rewrites kubernetes_semver per run) while pause_image is a
# single static default, so comparing to it would fire on every build of a
# different minor -- pause is 3.10.1 across all of 1.34/1.35 and 3.10.2 from
# 1.36.0 on.
#
# ctr is called by absolute path on purpose: goss runs under sudo, and on EL
# hosts sudoers' secure_path is /sbin:/bin:/usr/sbin:/usr/bin -- so the
# containerd binaries under /usr/local/bin are not on PATH there.
  {{ .Vars.sysusrlocal_prefix }}/bin/ctr -n k8s.io images ls -q | grep -F -f /etc/containerd/pinned-pause-image:
    exit-status: 0
    stdout: ["/pause:"]
    stderr: []
    timeout: 0
# The rendered root config version must equal what `containerd config default`
# prints (drop-ins at a higher version are refused). Absolute path for the same
# secure_path reason as ctr above; POSIX sh only -- goss runs commands through sh.
  test "$(grep '^version' /etc/containerd/config.toml)" = "$({{ .Vars.sysusrlocal_prefix }}/bin/containerd config default | grep '^version')":
    exit-status: 0
    stdout: []
    stderr: []
    timeout: 0
  crictl images | grep -v 'IMAGE ID' | awk -F'[ /]' '{print $2}' | sed 's/-{{ .Vars.arch }}//g' | sort:
    exit-status: 0
    stderr: []
    timeout: 0
    stdout: ["coredns", "etcd", "kube-apiserver", "kube-controller-manager", "kube-proxy", "kube-scheduler", "pause"]
{{if eq .Vars.accel_provider "nvidia"}}
# The boot units ansible/roles/nvidia/doca installs and enables. Asserted with
# is-enabled rather than goss's service resource, which insists on a `running`
# expectation too: all three are oneshot units the build runs by hand, never
# through systemd, so their active state at capture says nothing about a booted
# node. One command per unit, because `systemctl is-enabled a b c` exits 0 when
# any one of them is enabled.
  systemctl is-enabled openibd:
    exit-status: 0
    stdout: ["enabled"]
    stderr: []
    timeout: 0
  systemctl is-enabled mlx-modules-ensure:
    exit-status: 0
    stdout: ["enabled"]
    stderr: []
    timeout: 0
  systemctl is-enabled ofa-kernel-normalize:
    exit-status: 0
    stdout: ["enabled"]
    stderr: []
    timeout: 0
{{end}}
# The guest agent RPC surface from ansible/roles/customize, on every image.
# 13 RPCs must be enabled: KubeVirt's basic set (virt-handler
# requiredGuestAgentCommands) and the fsfreeze calls VM snapshots make. 12 must
# not be: guest-exec* and guest-file-*, which would give the host-side channel
# root command execution or arbitrary file read/write, and
# guest-set-user-password and guest-ssh-*-authorized-keys, which would let it
# reset a user's password or SSH keys. One count per side, because a grep over
# the whole list exits 0 when any single name matches.
{{if eq .Vars.OS "rockylinux"}}
# The role writes the allow-list into FILTER_RPC_ARGS in /etc/sysconfig/qemu-ga,
# which the unit passes on the command line.
  sed -n 's/^FILTER_RPC_ARGS="--allow-rpcs=\(.*\)"$/\1/p' /etc/sysconfig/qemu-ga | tr ',' '\n' | grep -cxE 'guest-(ping|get-time|info|shutdown|network-get-interfaces|get-fsinfo|get-host-name|get-users|get-timezone|get-osinfo|fsfreeze-(status|freeze|thaw))':
    exit-status: 0
    stdout: ["/^13$/"]
    stderr: []
    timeout: 0
  sed -n 's/^FILTER_RPC_ARGS="--allow-rpcs=\(.*\)"$/\1/p' /etc/sysconfig/qemu-ga | tr ',' '\n' | grep -cxE 'guest-(exec|exec-status|file-(open|close|read|write|seek|flush)|set-user-password|ssh-(get|add|remove)-authorized-keys)':
    exit-status: 1
    stdout: ["/^0$/"]
    stderr: []
    timeout: 0
  systemctl cat qemu-guest-agent | grep -cF '${FILTER_RPC_ARGS}':
    exit-status: 0
    stdout: ["/^1$/"]
    stderr: []
    timeout: 0
  systemctl is-enabled qemu-guest-agent:
    exit-status: 0
    stdout: ["/^enabled$/"]
    stderr: []
    timeout: 0
  getsebool virt_qemu_ga_manage_ssh:
    exit-status: 0
    stdout: ["virt_qemu_ga_manage_ssh --> off"]
    stderr: []
    timeout: 0
  getsebool virt_qemu_ga_read_nonsecurity_files:
    exit-status: 0
    stdout: ["virt_qemu_ga_read_nonsecurity_files --> on"]
    stderr: []
    timeout: 0
{{end}}
{{if eq .Vars.OS "ubuntu"}}
# Ubuntu's package ships no filter; the role writes the same allow-list into
# /etc/qemu/qemu-ga.conf. `qemu-ga -D` prints the configuration the agent would
# run with -- that file merged over the defaults -- and exits without opening
# the channel.
  qemu-ga -D | sed -n 's/^allow-rpcs=//p' | tr ',' '\n' | grep -cxE 'guest-(ping|get-time|info|shutdown|network-get-interfaces|get-fsinfo|get-host-name|get-users|get-timezone|get-osinfo|fsfreeze-(status|freeze|thaw))':
    exit-status: 0
    stdout: ["/^13$/"]
    stderr: []
    timeout: 0
  qemu-ga -D | sed -n 's/^allow-rpcs=//p' | tr ',' '\n' | grep -cxE 'guest-(exec|exec-status|file-(open|close|read|write|seek|flush)|set-user-password|ssh-(get|add|remove)-authorized-keys)':
    exit-status: 1
    stdout: ["/^0$/"]
    stderr: []
    timeout: 0
  qemu-ga -D | grep -cxE 'block-rpcs=|fsfreeze-hook=/etc/qemu/fsfreeze-hook':
    exit-status: 0
    stdout: ["/^2$/"]
    stderr: []
    timeout: 0
{{end}}
{{if ne .Vars.accel_provider "nvidia"}}
# ansible/roles/node/tasks/nouveau.yml: modprobe reads the blacklist, and an
# initramfs holding nouveau.ko holds it too (NR < 100: unreadable initramfs).
  modprobe -c | grep -xE 'blacklist nouveau|options nouveau modeset=0' | sort -u | wc -l:
    exit-status: 0
    stdout: ["/^2$/"]
    stderr: []
    timeout: 0
{{if eq .Vars.OS "ubuntu"}}
  lsinitramfs /boot/initrd.img-$(uname -r) | awk '/\/nouveau\.ko/{m=1} /etc\/modprobe\.d\/blacklist-nouveau\.conf$/{b=1} END{print NR " entries, nouveau.ko " m+0 ", blacklist " b+0; exit (NR < 100 || (m && !b))}':
    exit-status: 0
    stdout: []
    stderr: []
    timeout: 60000
{{end}}
{{if eq .Vars.OS "rockylinux"}}
  lsinitrd /boot/initramfs-$(uname -r).img | awk '/\/nouveau\.ko/{m=1} /etc\/modprobe\.d\/blacklist-nouveau\.conf$/{b=1} END{print NR " entries, nouveau.ko " m+0 ", blacklist " b+0; exit (NR < 100 || (m && !b))}':
    exit-status: 0
    stdout: []
    stderr: []
    timeout: 60000
{{end}}
{{end}}
# ansible/roles/usage_reports: no package repository counts the node (dnf countme), and Ubuntu
# fetches neither the motd news nor Ubuntu Pro's APT news.
{{if eq .Vars.OS "rockylinux"}}
  grep -hsE '^[[:space:]]*countme[[:space:]]*=' /etc/dnf/dnf.conf /etc/yum.repos.d/*.repo | grep -cvx 'countme=0':
    exit-status: 1
    stdout: ["/^0$/"]
    stderr: []
    timeout: 0
{{end}}
{{if eq .Vars.OS "ubuntu"}}
  . /etc/default/motd-news && echo "ENABLED=$ENABLED":
    exit-status: 0
    stdout: ["/^ENABLED=0$/"]
    stderr: []
    timeout: 0
  pro config show apt_news:
    exit-status: 0
    stdout: ["/^apt_news False$/"]
    stderr: []
    timeout: 0
{{end}}
{{range $name, $vers := index .Vars .Vars.OS .Vars.PROVIDER "command"}}
  {{ $name }}:
  {{range $key, $val := $vers}}
    {{$key}}: {{$val}}
  {{end}}
{{end}}
