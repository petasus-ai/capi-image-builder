---
common_rpms: &common_rpms
  audit:
  ca-certificates:
  cloud-init:
  cloud-utils-growpart:
  conntrack-tools:
  chrony:
  curl:
  jq:
  python3-pip:
  socat:
  sysstat:
  yum-utils:

rh8_rpms: &rh8_rpms
  nftables:
  python3-netifaces:
  python3-requests:

common_debs: &common_debs
  auditd:
  apt-transport-https:
  conntrack:
  chrony:
  curl:
  ebtables:
  jq:
  gnupg:
  libnetfilter-acct1:
  libnetfilter-cttimeout1:
  libnetfilter-log1:
  python3-setuptools:
  python3-netifaces:
  python3-pip:
  socat:

arch: ""
sysusrlocal_prefix: ""
kubernetes_cni_version: ""
kubernetes_rpm_version: ""
kubernetes_deb_version: ""

# OS Specific package/Command/Kernal Params etc...
# Structured in below format
# OS_NAME
#   common-package:
#   common-kernel-params:
#   common-services:
#   PROVIDER_NAME:
#     package:
#     command:
#     service:
#  ...
rockylinux:
  common-package: *common_rpms
  qemu:
    command:
      # Predictable NIC naming: sysprep strips net.ifnames=0/biosdevname=0 that the
      # GenericCloud base image bakes into the kernel cmdline. /proc/cmdline still
      # shows the old value (no reboot after sysprep), so check the boot config.
      # grep exit 1 = tokens absent (pass); 0 = present; 2 = path missing.
      grep -Er 'net\.ifnames=|biosdevname=' /boot/loader/entries/ /etc/default/grub:
        exit-status: 1
        stdout: []
        stderr: []
        timeout: 0
    package:
      cloud-init:
      python3-netifaces:
      <<: *rh8_rpms
ubuntu:
  common-kernel-param:
    net.ipv4.conf.all.rp_filter:
      value: "1"
  common-package:
    <<: *common_debs
  common-service:
    apt-daily.timer:
      enabled: false
      running: false
    apt-daily-upgrade.timer:
      enabled: false
      running: false
  qemu:
    package:
      linux-tools-virtual:
      open-vm-tools:
      cloud-guest-utils:
      cloud-initramfs-copymods:
      cloud-initramfs-dyn-netconf:
