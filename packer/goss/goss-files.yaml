file:
{{range $name, $vers := index .Vars .Vars.OS "common-files"}}
  {{ $name }}:
    exists: {{ $vers.exists }}
    filetype: {{ $vers.filetype }}
    contains: {{ range $vers.contains}}
    - {{.}}
  {{end}}
{{end}}
{{range $name, $vers := index .Vars .Vars.OS .Vars.PROVIDER "files"}}
  {{ $name }}:
    exists: {{ $vers.exists }}
    filetype: {{ $vers.filetype }}
    contains: {{ range $vers.contains}}
    - {{.}}
  {{end}}
{{end}}
{{if eq .Vars.accel_provider "nvidia"}}
# The ExecStart targets of the units asserted in goss-service.yaml; an enabled
# unit whose script went missing would otherwise pass.
  /usr/local/sbin/mlx-modules-ensure.sh:
    exists: true
    filetype: file
    mode: "0755"
  /usr/local/sbin/ofa-kernel-normalize.sh:
    exists: true
    filetype: file
    mode: "0755"
{{end}}
