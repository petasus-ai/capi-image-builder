kubernetes_version: &kubernetes_version
  versions:
    or:
     - contain-element:
         match-regexp: "^\\Q{{ .Vars.kubernetes_deb_version }}\\E$"
     - contain-element:
         match-regexp: "^\\Q{{ .Vars.kubernetes_rpm_version }}\\E$"

kubernetes_cni_version: &kubernetes_cni_version
  versions:
    contain-element:
      # The deb/rpm pin vars are deliberately null (the k8s package repo
      # resolves the version kubeadm depends on), so assert against the
      # semver-derived version instead. The optional suffix covers the deb
      # form (1.9.1-1.1) next to the rpm form (1.9.1).
      match-regexp: "^\\Q{{ .Vars.kubernetes_cni_version }}\\E(-.*)?$"

package:
  cloud-init:
    installed: true
  ntp:
    installed: false
  kubeadm:
    installed: true
    <<: *kubernetes_version
  kubelet:
    installed: true
    <<: *kubernetes_version
  kubectl:
    installed: true
    <<: *kubernetes_version
  kubernetes-cni:
    installed: true
    <<: *kubernetes_cni_version
# Looping over common packages for an OS
{{range $name, $vers := index .Vars .Vars.OS "common-package"}}
  {{$name}}:
    installed: true
  {{range $key, $val := $vers}}
    {{$key}}: {{$val}}
  {{end}}
{{end}}
# Looping over provider specific packages for an OS
{{range $name, $vers := index .Vars .Vars.OS .Vars.PROVIDER "package"}}
  {{$name}}:
    installed: true
  {{range $key, $val := $vers}}
    {{$key}}: {{$val}}
  {{end}}
{{end}}
